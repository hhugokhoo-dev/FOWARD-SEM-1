<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Section</title>
    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hero {
            height: 800px;
            background-image: url('https://picsum.photos/1200/800');
            background-size: cover;
            display: flex;
            background-position: center;
            justify-content: center;
            align-items: center;
        }

        .hero-content {
            background-color: rgba(0, 0, 0, 0.7);
            text-align: center;
            color: red;
           
        }

    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1>Explore the World</h1>
            <p>Discover stunning landscapes, hidden gems, and unforgettable adventures — all from one place.</p>
            <span class="tagline">Start your journey →</span>
        </div>
    </section>

</body>
</html>
