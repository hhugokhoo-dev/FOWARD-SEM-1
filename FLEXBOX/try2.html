<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    background: blue;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Georgia, 'Times New Roman', Times, serif;
}

.card{
    width: 395px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

.card img{
    width: 100%;
    height: 295px;
    object-fit: cover;
    display: block;
}

.content{
    padding: 24px;
}

.badge{
    display: inline-block;
    background: #dff0de;
    color: #2f7b37;
    font-size: 15px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
}

h1{
    font-size: 42px;
    line-height: 1.1;
    color: #202020;
    margin-bottom: 10px;
}

.subtitle{
    color: #6d6d6d;
    font-size: 18px;
    margin-bottom: 28px;
}

.description{
    color: #444;
    line-height: 1.7;
    font-size: 18px;
    margin-bottom: 28px;
}

.year-title{
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 6px;
}

.year{
    color: #888;
    font-size: 18px;
    margin-bottom: 26px;
}

.price{
    color: #e53935;
    font-size: 54px;
    font-weight: bold;
    margin-bottom: 22px;
}

button{
    width: 100%;
    height: 58px;
    border: none;
    border-radius: 14px;
    background: #000;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover{
    background: #222;
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>noob</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="card">
        <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=680&q=80" alt="my mustang">
        <div class="content">
            <span class="badge"> FOR SALE</span>
            <h1>2021 Ford Mustang GT</h1>
            <p class="subtitle">Premium | Fastback | V8</p>

            <p class="description">
                One owner, no accidents. Loaded with premium package, Brembo brakes, and active exhaust.
                Garage kept and meticulously maintained
            </p>

            <div class="year-title">YEAR</div>
            <div class="year">2021</div>

            <div class="price">$38500</div>

            <button>Contact Seller</button>
        </div>
    </div>
</body>
</html>
