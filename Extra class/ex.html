<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #efefef;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .box {
    width: 220px;
    height: 100px;
    border-radius: 8px;
  }

  .red   { background-color: #e0463f; }
  .blue  { background-color: #3399d6; }
  .green { background-color: #22c369; }
</style>
</head>
<body>

  <div class="stack">
    <div class="box red"></div>
    <div class="box blue"></div>
    <div class="box green"></div>
  </div>

</body>
</html>
